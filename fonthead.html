<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>fonthead.dev — library · font page · maker</title>

<!-- specimen + chrome fonts. The loud display families stand in for
     community-made fonts until the user supplies their own files. -->
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600;700&family=Bungee&family=Bungee+Shade&family=Anton&family=Monoton&family=Abril+Fatface&family=DM+Serif+Display&family=Pacifico&family=Caveat:wght@400;600&family=Gloria+Hallelujah&family=VT323&family=Silkscreen:wght@400;700&family=Spectral:ital@0;1&family=Fraunces:ital,opsz,wght@0,9..144,300..900;1,9..144,300..900&family=Shadows+Into+Light&family=Outfit:wght@200;300;400&display=swap" rel="stylesheet" />

<link href="fonthead.css" rel="stylesheet" />
<style>
  html, body { margin: 0; height: 100%; background: #f0eee9; }
</style>

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
</head>
<body>
<div id="root"></div>

<script type="text/babel" src="design-canvas.jsx"></script>
<script type="text/babel" src="fh-data.jsx"></script>
<script type="text/babel" src="fh-shared.jsx"></script>
<script type="text/babel" src="fh-library.jsx"></script>
<script type="text/babel" src="fh-fontpage.jsx"></script>
<script type="text/babel" src="fh-maker.jsx"></script>
<script type="text/babel" src="fh-variations.jsx"></script>

<script type="text/babel" data-presets="react">
function NotesCard() {
  return (
    <div className="fh" style={{ width: 560, padding: "34px 36px", lineHeight: 1.55 }}>
      <div className="fh-eyebrow">fonthead.dev · design notes</div>
      <h2 style={{ fontFamily: "var(--mono)", fontWeight: 700, fontSize: 22,
        letterSpacing: "-.01em", margin: "14px 0 4px" }}>
        A white room full of work.</h2>
      <p style={{ fontSize: 14, color: "var(--ink-soft)", margin: "0 0 18px" }}>
        The chrome is near-monochrome and set in mono. The only real color comes
        from the fonts themselves. One signal red appears, and only on an active
        favorite, an active upvote, the build pulse, and the type cursor.
      </p>
      <ul style={{ fontSize: 13, color: "var(--ink-soft)", margin: 0, paddingLeft: 18,
        display: "flex", flexDirection: "column", gap: 7 }}>
        <li><b style={{ color: "var(--ink)" }}>One mechanical easing</b> across everything.
          No spring, no bounce. The restraint is the tell.</li>
        <li><b style={{ color: "var(--ink)" }}>The machine shows its work.</b> The maker
          ticks through binarize · slice · trace · build. Not a spinner.</li>
        <li><b style={{ color: "var(--ink)" }}>The card becomes the page.</b> Click any
          specimen in the library to watch it expand into the font page.</li>
        <li><b style={{ color: "var(--ink)" }}>Specimens are stand-ins.</b> Real Google
          faces fill the wall now; drop in your own font files to replace them.</li>
      </ul>
      <p className="fh-mono" style={{ fontSize: 11, color: "var(--ink-faint)",
        marginTop: 20, letterSpacing: ".02em" }}>
        try it · type into the font page · hover + favorite a card · watch the maker build
      </p>
    </div>
  );
}

// reference wrappers for the variation sections
function CardReadoutRef() {
  const f = FH_FONTS.find(x => x.id === "ember-flux");
  return (
    <div className="fh" style={{ width: 360 }}>
      <FontCard f={f} onOpen={() => {}} />
    </div>
  );
}
function HeroColossusRef() {
  return (
    <div className="fh" style={{ width: 760, height: 380, display: "flex",
      flexDirection: "column" }}>
      <div className="fh-nav" style={{ height: 54, padding: "0 28px" }}>
        <div className="fh-wordmark" style={{ fontSize: 14 }}>fonthead<span className="dot">.dev</span></div>
      </div>
      <div style={{ flex: 1, display: "flex", alignItems: "center", justifyContent: "center" }}>
        <div style={{ transform: "scale(.62)" }}><CyclingWordmark /></div>
      </div>
    </div>
  );
}

function App() {
  return (
    <DesignCanvas>
      <DCSection id="notes" title="fonthead.dev" subtitle="Community font library + maker · three screens, one system">
        <DCArtboard id="notes" label="Read me" width={560} height={392}>
          <NotesCard />
        </DCArtboard>
      </DCSection>

      <DCSection id="screens" title="The three screens" subtitle="Live — type into specimens, favorite, sort, watch the maker build. Click a library card to morph into the font page.">
        <DCArtboard id="library" label="01 · Library — home / browse" width={1280} height={2096}>
          <LibraryScreen />
        </DCArtboard>
        <DCArtboard id="fontpage" label="02 · Font page — type-into specimen" width={1280} height={1216}>
          <FontPageScreen />
        </DCArtboard>
        <DCArtboard id="maker" label="03 · Maker — drop, build, publish" width={1280} height={1012}>
          <MakerScreen />
        </DCArtboard>
      </DCSection>

      <DCSection id="hero" title="Hero — masthead options" subtitle="The cycling wordmark is the daily feature. Three ways to frame it.">
        <DCArtboard id="hero-a" label="A · Centered colossus (in use)" width={760} height={380}>
          <HeroColossusRef />
        </DCArtboard>
        <DCArtboard id="hero-b" label="B · Split — word + today's top three" width={760} height={380}>
          <HeroSplit />
        </DCArtboard>
        <DCArtboard id="hero-c" label="C · Specimen ticker" width={760} height={380}>
          <HeroTicker />
        </DCArtboard>
      </DCSection>

      <DCSection id="cards" title="Card — wall options" subtitle="How loud is each font on the wall.">
        <DCArtboard id="card-a" label="A · Readout (in use)" width={360} height={356}>
          <CardReadoutRef />
        </DCArtboard>
        <DCArtboard id="card-b" label="B · Quiet — type does the talking" width={360} height={296}>
          <CardQuiet />
        </DCArtboard>
        <DCArtboard id="card-c" label="C · Editorial — mini specimen sheet" width={360} height={340}>
          <CardEditorial />
        </DCArtboard>
      </DCSection>
    </DesignCanvas>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
