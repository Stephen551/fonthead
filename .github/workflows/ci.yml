name: ci

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: type check
        run: npm run check
      - name: build
        run: npm run build
      - name: unit tests
        run: npm test

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: install browser
        run: npx playwright install --with-deps chromium
      - name: e2e smoke
        run: npm run test:e2e
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: independent font validity check (fontTools, the gate Windows applies)
        run: |
          pip install --quiet fonttools
          python -c "from fontTools.ttLib import TTFont; TTFont('e2e/built-sample.otf', checkChecksums=2); print('fontTools strict checksums: OK')"
