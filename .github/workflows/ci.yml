name: ci

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: type check
        run: npm run check
      - name: build
        run: npm run build
      - name: unit tests
        run: npm test

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: install browser
        run: npx playwright install --with-deps chromium
      - name: apply local D1 migrations (the dev server the e2e suite boots reads this D1; without the schema every page 500s and Playwright never sees the server become ready)
        run: npm run db:apply:local
      - name: seed the wall (starter set plus house fonts) so the library search specs have data to match
        run: |
          npx wrangler d1 execute DB --local --file scripts/seed.generated.sql
          npx wrangler d1 execute DB --local --file scripts/add-ac-fonts.sql
      - name: provide dev runtime env (gitignored .dev.vars, read by the platform proxy; CI-only placeholders, not real secrets)
        run: |
          printf 'BETTER_AUTH_SECRET=fonthead-ci-e2e-placeholder-secret\nBETTER_AUTH_URL=http://localhost:4321\n' > .dev.vars
      - name: e2e smoke
        run: npm run test:e2e
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: independent font validity check (fontTools, the gate Windows applies)
        run: |
          pip install --quiet fonttools
          python -c "from fontTools.ttLib import TTFont; TTFont('e2e/built-sample.otf', checkChecksums=2); print('fontTools strict checksums: OK')"
          python -c "from fontTools.ttLib import TTFont; v=TTFont('e2e/built-variation.otf', checkChecksums=2); assert 'GSUB' in v, 'natural-variation font missing GSUB'; tags=[f.FeatureTag for f in v['GSUB'].table.FeatureList.FeatureRecord]; assert 'calt' in tags, 'natural-variation font missing calt'; print('natural variation GSUB calt: OK')"

  deploy:
    needs: build-and-test
    if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: deploy to cloudflare workers
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "::warning::CLOUDFLARE_API_TOKEN secret is not set, skipping deploy. Add it under Settings, Secrets and variables, Actions to enable auto-deploy."
            exit 0
          fi
          npm run deploy
